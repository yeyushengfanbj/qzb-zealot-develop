services:
  postgres:
    image: postgres:14-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: zealot
    volumes:
      - zealyn-postgres:/var/lib/postgresql/data

  zealyn:
    image: ${ZEALOT_IMAGE:-ghcr.io/tryzealot/zealot:nightly}
    restart: unless-stopped
    depends_on:
      - postgres
    env_file:
      - .env.local
    ports:
      - "8080:80"
    volumes:
      - zealyn-uploads:/app/public/uploads
      - zealyn-backup:/app/public/backup

volumes:
  zealyn-postgres:
    name: zealyn-develop-postgres
  zealyn-uploads:
    name: zealyn-develop-uploads
  zealyn-backup:
    name: zealyn-develop-backup
