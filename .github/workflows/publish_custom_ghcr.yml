name: Publish Custom GHCR Image

on:
  push:
    branches:
      - main
      - master
      - develop
  workflow_dispatch:
    inputs:
      tag:
        description: Custom image tag, e.g. v1.0.0
        required: false
        default: ""

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: vars
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY}"
          SHORT_SHA="${GITHUB_SHA::12}"
          BRANCH_TAG="${GITHUB_REF_NAME}"

          {
            echo "image=${IMAGE}"
            echo "tags<<EOF"
            echo "${IMAGE}:${BRANCH_TAG}"
            echo "${IMAGE}:sha-${SHORT_SHA}"

            if [[ "${GITHUB_REF_NAME}" == "main" || "${GITHUB_REF_NAME}" == "master" ]]; then
              echo "${IMAGE}:latest"
            fi

            if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" && -n "${{ github.event.inputs.tag }}" ]]; then
              echo "${IMAGE}:${{ github.event.inputs.tag }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and Push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.vars.outputs.tags }}
          build-args: |
            REPLACE_CHINA_MIRROR=false
            VCS_REF=${{ github.sha }}
            TAG=${{ github.ref_name }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
